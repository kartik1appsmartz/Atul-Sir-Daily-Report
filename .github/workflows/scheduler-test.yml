name: Scheduler Test

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Scheduler Test
        run: |
          echo "================================="
          echo "SCHEDULE TRIGGERED SUCCESSFULLY"
          echo "UTC:"
          date -u
          echo "IST:"
          TZ=Asia/Kolkata date
          echo "================================="
