name: Android Daily Users Report

on:
  schedule:
    # Trigger at 1:15 PM IST (7:45 AM UTC)
    # Note: GitHub may delay execution by 10-30 minutes based on queue loads
    - cron: "15 7 * * *"

  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service.json

      - name: Run Android Daily Users Report
        env:
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service.json
        run: |
          python Android_Daily_Users_Report_updated.py
