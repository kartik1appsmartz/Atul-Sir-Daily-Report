name: Android Daily Users Report

on:
  schedule:
    # 11:00 AM IST = 05:30 UTC
    - cron: "30 7 * * *"

  workflow_dispatch:

jobs:
  daily-report:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT CODE
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # CREATE GOOGLE SERVICE ACCOUNT FILE
      # ======================================================

      - name: Create service account JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service.json

      # ======================================================
      # RUN REPORT
      # ======================================================

      - name: Run Android Daily Users Report
        env:
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service.json
        run: |
          python Android_Daily_Users_Report_updated.py
